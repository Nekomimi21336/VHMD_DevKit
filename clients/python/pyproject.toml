[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vhmd-client"
version = "0.2.0"
description = "UDP/JSON client for the VirtualHMD SteamVR development driver"
requires-python = ">=3.10"
license = { text = "BSD-3-Clause" }
dependencies = []

[project.optional-dependencies]
verify = ["openvr>=1.26"]   # pyopenvr, used by tests/integration
gamepad = ["pygame>=2.5"]

[project.scripts]
vhmd-fps = "vhmd_client.fps:main"   # Windows only

[tool.setuptools]
packages = ["vhmd_client"]
